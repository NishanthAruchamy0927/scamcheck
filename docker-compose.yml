version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: scamcheck_db
    environment:
      POSTGRES_USER: scamcheck
      POSTGRES_PASSWORD: scamcheckpassword
      POSTGRES_DB: scamcheck
    ports:
      - "5432:5432"
    volumes:
      - scamcheck_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamcheck -d scamcheck"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scamcheck_pgdata:
