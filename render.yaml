services:
  - type: web
    name: scamcheck
    env: node
    plan: free
    buildCommand: npm run postinstall && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      # Render terminates TLS at a proxy; trust one hop so rate limits see real client IPs
      - key: TRUST_PROXY
        value: 1
      - key: JWT_SECRET
        generateValue: true
      # Optional: set DATABASE_URL (PostgreSQL) and ML_SERVICE_URL in the Render dashboard
